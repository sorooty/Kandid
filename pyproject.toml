[project]
name = "kandid-tools"
version = "0.1.0"
description = "Tools behind the Kandid Claude Code plugin: ATS check, CV and letter rendering, offer watch, tracking."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/kandid_tools"]

[tool.uv]
# Supply-chain guard, same rule as pnpm minimumReleaseAge: only versions published at least 14 days ago.
exclude-newer = "14 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
