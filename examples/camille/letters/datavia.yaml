subject: Candidature en alternance, Data Analyst (Master MIAGE, 24 mois)
body: |
  Rendre les données de mobilité lisibles pour les collectivités, c'est exactement le type de mission
  qui m'a fait choisir la data. J'entre en Master MIAGE parcours Data à Lyon 2 en septembre 2027 et je
  souhaite rejoindre votre équipe pour les deux années de mon alternance.

  Chez Lumio Énergie, j'ai construit un tableau de bord Power BI alimenté par des requêtes SQL sur
  PostgreSQL, aujourd'hui utilisé par trois équipes commerciales. J'y ai aussi automatisé le nettoyage
  des relevés en Python, ce qui a fait gagner six heures par semaine. Comme tutrice, j'ai appris à
  expliquer simplement des notions techniques, ce qui me servira pour présenter vos analyses aux
  collectivités.

  Le rythme de trois semaines en entreprise me permettrait de suivre des projets de bout en bout,
  de la requête au tableau de bord présenté au client.

  Je serais heureuse d'échanger avec vous sur vos projets lors d'un entretien.
