<title id="title">Où vont tes données : profil, réglages, base de suivi et PDF restent sur ton ordinateur ; Claude reçoit le strict nécessaire ; l'artefact de suivi ne reçoit qu'une copie des champs du tableau ; le courrier ne lit que l'expéditeur, le sujet et l'aperçu.</title>
